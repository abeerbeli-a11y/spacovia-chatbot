<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spacovia Chatbot Admin</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#1a1a2e" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Spacovia Admin" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="./icon.png" />
<link rel="icon" href="./icon.png" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: #f4f4fa;
    color: #1a1a2e;
  }
  header {
    background: #1a1a2e;
    color: #fff;
    padding: 16px 24px;
    font-weight: 600;
    font-size: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #logout-btn {
    background: none;
    border: 1px solid #fff;
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  main {
    max-width: 800px;
    margin: 24px auto;
    padding: 0 16px;
  }
  #login-view {
    max-width: 320px;
    margin: 80px auto;
    background: #fff;
    padding: 24px;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  #login-view h2 { margin-top: 0; font-size: 18px; }
  input[type="password"], textarea, input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  button.primary {
    background: #1a1a2e;
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 10px;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  .error { color: #c0392b; font-size: 13px; margin-top: 8px; }
  .status { color: #2a7a2a; font-size: 13px; margin-top: 8px; }
  nav.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
  }
  nav.tabs button {
    background: #fff;
    border: 1px solid #ddd;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  nav.tabs button.active {
    background: #1a1a2e;
    color: #fff;
    border-color: #1a1a2e;
  }
  .panel {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: none;
  }
  .panel.active { display: block; }
  textarea#knowledge-text { min-height: 360px; font-family: monospace; font-size: 13px; }
  .inbox-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 12px 10px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
  }
  .inbox-item:hover { background: #fafafd; }
  .inbox-item .preview {
    font-size: 13px;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .inbox-item .preview .from { color: #888; }
  .inbox-item .meta { font-size: 11px; color: #999; white-space: nowrap; flex-shrink: 0; }
  .badge-paused {
    display: inline-block;
    background: #c0392b;
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    margin-right: 6px;
  }
  .thread-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .back-btn {
    background: none;
    border: none;
    font-size: 14px;
    cursor: pointer;
    color: #1a1a2e;
    padding: 4px 8px 4px 0;
  }
  #thread-pause-toggle { margin-top: 0; white-space: nowrap; }
  #thread-pause-toggle.is-live { background: #c0392b; }
  .thread-messages {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 48vh;
    overflow-y: auto;
    padding: 10px;
    background: #fafafd;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .thread-msg {
    max-width: 82%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    white-space: pre-wrap;
  }
  .thread-msg .who { display: block; font-size: 10px; opacity: 0.6; margin-bottom: 2px; }
  .thread-msg.visitor { align-self: flex-start; background: #fff; border: 1px solid #e5e5ef; }
  .thread-msg.bot { align-self: flex-start; background: #e9e9f6; }
  .thread-msg.admin { align-self: flex-end; background: #1a1a2e; color: #fff; }
  .thread-reply { display: flex; gap: 6px; align-items: flex-start; }
  .thread-reply textarea { min-height: 42px; max-height: 140px; resize: vertical; }
  .thread-reply button { margin-top: 0; flex-shrink: 0; }
  .ai-editor { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
  .usage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .usage-card { background: #fafafd; border: 1px solid #eee; border-radius: 8px; padding: 12px 14px; }
  .usage-card .label { font-size: 12px; color: #888; }
  .usage-card .value { font-size: 20px; font-weight: 600; margin-top: 4px; }
  label.cap-label { display: block; font-size: 13px; margin-top: 14px; margin-bottom: 4px; color: #555; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }

  @media (max-width: 480px) {
    header { padding: 12px 16px; font-size: 16px; }
    main { margin: 16px auto; padding: 0 12px; }
    nav.tabs {
      overflow-x: auto;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
      margin: 0 -12px 16px;
      padding: 0 12px 4px;
    }
    nav.tabs button { flex: 0 0 auto; white-space: nowrap; font-size: 13px; padding: 8px 14px; }
    .panel { padding: 14px; }
    .usage-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .usage-card .value { font-size: 18px; }
    textarea#knowledge-text { min-height: 50vh; }
    .thread-messages { max-height: 42vh; }
    .inbox-item .preview { font-size: 12px; }
  }
</style>
</head>
<body>

<div id="login-view">
  <h2>Admin login</h2>
  <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
  <button class="primary" id="login-btn">Log in</button>
  <div class="error" id="login-error"></div>
</div>

<div id="app-view" style="display:none">
  <header>
    <span>Spacovia Chatbot Admin</span>
    <button id="logout-btn">Log out</button>
  </header>
  <main>
    <nav class="tabs">
      <button data-tab="knowledge" class="active">Knowledge</button>
      <button data-tab="conversations">Conversations</button>
      <button data-tab="usage">Usage &amp; limits</button>
    </nav>

    <section class="panel active" id="panel-knowledge">
      <p class="hint">This is what the bot knows. Edit directly below, or describe a change and let the AI do it.</p>

      <div class="ai-editor">
        <div class="thread-reply">
          <textarea id="knowledge-ai-instruction" placeholder="e.g. Add that we now offer a 10% discount for annual payment"></textarea>
          <button class="primary" id="knowledge-ai-ask">Ask AI</button>
        </div>
        <div class="status" id="knowledge-ai-status"></div>
      </div>

      <textarea id="knowledge-text"></textarea>
      <button class="primary" id="knowledge-save">Save</button>
      <div class="status" id="knowledge-status"></div>
    </section>

    <section class="panel" id="panel-conversations">
      <div id="inbox-list-view">
        <p class="hint">Tap a conversation to read it and reply. Most recent first.</p>
        <div id="conversations-list"></div>
      </div>
      <div id="inbox-thread-view" style="display:none">
        <div class="thread-header">
          <button class="back-btn" id="thread-back">&larr; Back to all</button>
          <button class="primary" id="thread-pause-toggle"></button>
        </div>
        <div class="thread-messages" id="thread-messages"></div>
        <div class="thread-reply">
          <textarea id="thread-reply-text" placeholder="Reply as yourself — this stops the bot replying to this visitor"></textarea>
          <button class="primary" id="thread-reply-send">Send</button>
        </div>
        <div class="status" id="thread-status"></div>
      </div>
    </section>

    <section class="panel" id="panel-usage">
      <div class="usage-grid">
        <div class="usage-card">
          <div class="label">Messages today</div>
          <div class="value" id="usage-day-messages">—</div>
        </div>
        <div class="usage-card">
          <div class="label">Tokens this month</div>
          <div class="value" id="usage-month-tokens">—</div>
        </div>
      </div>
      <label class="cap-label" for="cap-daily">Max messages per day (leave blank for no limit)</label>
      <input type="number" id="cap-daily" min="0" />
      <label class="cap-label" for="cap-monthly">Max tokens per month (leave blank for no limit)</label>
      <input type="number" id="cap-monthly" min="0" />
      <button class="primary" id="usage-save">Save limits</button>
      <div class="status" id="usage-status"></div>
    </section>
  </main>
</div>

<script src="./admin.js"></script>
</body>
</html>
